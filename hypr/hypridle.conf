
general {
    lock_cmd = pidof hyprlock || hyprlock                                     # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                  # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

# Messagge only for fun.
listener {
    timeout = 300                            # in seconds.
    on-timeout = notify-send "A dormir por inactividad..." # command to run when timeout has passed.
    on-resume = notify-send "De vuelta al trabajo!"  # command to run when activity is detected after timeout has fired.
}


# Reduce brightness.
listener {
    timeout = 150                                # 2.5min.
    on-timeout = ddcutil setvcp 10 10 --display 1 && ddcutil setvcp 10 10 --display 2      # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = ddcutil setvcp 10 100 --display 1 && ddcutil setvcp 10 100 --display 2                # monitor backlight restore.
}


# Lockscreen
listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

