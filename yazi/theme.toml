# Matugen template: yazi file manager theme from wallpaper

[mode]
normal_main = { fg = "#003354", bg = "#99cbff", bold = true }
normal_alt  = { fg = "#99cbff", bg = "reset" }
select_main = { fg = "#1e3245", bg = "#b4c8e1", bold = true }
select_alt  = { fg = "#b4c8e1", bg = "reset" }
unset_main  = { fg = "#432c00", bg = "#f5bd61", bold = true }
unset_alt   = { fg = "#f5bd61", bg = "reset" }

[status]
overall = { fg = "reset", bg = "reset" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type  = { fg = "#99cbff", bold = true }
perm_read  = { fg = "#f5bd61" }
perm_write = { fg = "#b4c8e1" }
perm_exec  = { fg = "#ffb4ab" }
perm_sep   = { fg = "#8b919a" }

progress_label  = { fg = "#e1e2e7", bold = true }
progress_normal = { fg = "#99cbff", bg = "reset" }
progress_error  = { fg = "#ffb4ab", bg = "reset" }

[mgr]
cwd = { fg = "#99cbff", bold = true }

find_keyword  = { fg = "#f5bd61", bold = true, italic = true, underline = true }
find_position = { fg = "#b4c8e1", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#99cbff", bg = "#99cbff" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#b4c8e1", bg = "#b4c8e1" }
marker_selected = { fg = "#f5bd61", bg = "#f5bd61" }

count_copied   = { fg = "#003354", bg = "#99cbff" }
count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#432c00", bg = "#f5bd61" }

border_symbol = "│"
border_style  = { fg = "#8b919a" }

hovered = { bg = "#37393d" }

[indicator]
parent  = { fg = "#b4c8e1", bold = true }
current = { fg = "#99cbff", bold = true }
preview = { fg = "#8b919a", bold = true }
padding = { open = "", close = " " }

[tabs]
active   = { fg = "#003354", bg = "#99cbff" }
inactive = { fg = "#e1e2e7", bg = "#1d2023" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[input]
border   = { fg = "#99cbff" }
title    = { fg = "#99cbff" }
value    = { fg = "#e1e2e7" }
selected = { reversed = true }

[pick]
border   = { fg = "#99cbff" }
active   = { fg = "#003354", bg = "#99cbff" }
inactive = { fg = "#e1e2e7" }

[confirm]
border = { fg = "#99cbff" }
title  = { fg = "#99cbff" }
body   = { fg = "#e1e2e7" }
list   = { fg = "#e1e2e7" }
btn_yes = { fg = "#003354", bg = "#99cbff" }
btn_no  = { fg = "#690005", bg = "#ffb4ab" }
btn_labels = [ " Yes ", " No " ]

[notify]
title_info  = { fg = "#99cbff" }
title_warn  = { fg = "#f5bd61" }
title_error = { fg = "#ffb4ab" }

[help]
on     = { fg = "#99cbff" }
run    = { fg = "#b4c8e1" }
desc   = { fg = "#e1e2e7" }
hovered = { reversed = true }
footer  = { fg = "#8b919a" }

[which]
cols = 3
mask = { bg = "#1d2023" }
cand = { fg = "#99cbff" }
rest = { fg = "#8b919a" }
desc = { fg = "#e1e2e7" }
separator = " → "
separator_style = { fg = "#8b919a" }

[tasks]
border  = { fg = "#99cbff" }
title   = { fg = "#99cbff" }
hovered = { reversed = true }

[filetype]
rules = [
    { mime = "image/*", fg = "#b4c8e1" },
    { mime = "{audio,video}/*", fg = "#b4c8e1" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },
    { mime = "application/{pdf,doc,rtf}", fg = "#99cbff" },
    { url = "*/", fg = "#b4c8e1", bold = true },
    { url = "*", fg = "#f5bd61" },
]

[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []
